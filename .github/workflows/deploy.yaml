name: Build and Publish Storybook to GitHub Pages
on:
  push:
    branches:
      - 'main' # Use specific branch name
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
      - name: Install dependencies
        run: pnpm i # Replace with appropriate command if using other package managers
      - name: Build Storybook
        run: pnpm run build-storybook
      - name: Build Svelte Project
        run: pnpm build
      - name: Move Storybook under Svelte
        run: mv storybook-static build/storybook
      # Upload pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'
      # Deploy to Github Pages
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}